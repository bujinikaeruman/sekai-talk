<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173b35">
<title>Sekai Talk | 音声翻訳</title>
<style>
:root{color-scheme:light;--ink:#173b35;--muted:#65736f;--paper:#f5f6f1;--line:#dce3dc;--accent:#b69a62}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:#1d2926;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
header{background:var(--ink);color:white;padding:24px 20px 28px}header small{letter-spacing:.16em;color:#d9c99e}h1{margin:8px 0 4px;font-size:29px;font-weight:650}header p{margin:0;color:#d9e2dc;font-size:13px}
main{max-width:680px;margin:auto;padding:18px 16px 40px}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 5px 20px #173b3508}
label{display:block;font-size:13px;font-weight:650;color:var(--muted);margin:0 0 8px}
select,textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:12px;background:#fff;padding:13px;color:#1d2926}
.languages{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}.swap{height:46px;width:44px;border:1px solid var(--line);border-radius:12px;background:#f8f8f4;font-size:20px;color:var(--ink)}
textarea{min-height:130px;resize:vertical;line-height:1.6}.output{min-height:110px;background:#f8faf7;border-radius:12px;padding:14px;white-space:pre-wrap;line-height:1.65;overflow-wrap:anywhere}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:13px 16px;font-weight:650}
.primary{background:var(--ink);color:white;flex:1}.secondary{background:#edf1eb;color:var(--ink)}button:disabled{opacity:.5}
.status{font-size:12px;color:var(--muted);min-height:20px;margin-top:10px}.note{font-size:12px;color:var(--muted);line-height:1.6;margin:14px 2px}
@media(max-width:390px){.languages{gap:6px}select{padding:11px 7px;font-size:14px}.swap{width:38px}}
</style>
</head>
<body>
<header><small>LANGUAGE, WITHOUT BORDERS</small><h1>Sekai Talk</h1><p>話して、訳して、声で伝える。</p></header>
<main>
<section class="panel">
<div class="languages">
<div><label for="from">翻訳元</label><select id="from"></select></div>
<button class="swap" id="swap" aria-label="言語を入れ替え">⇄</button>
<div><label for="to">翻訳先</label><select id="to"></select></div>
</div>
</section>
<section class="panel">
<label for="source">話す内容・翻訳する文章</label>
<textarea id="source" placeholder="ここに文章を入力するか、マイクで話してください。"></textarea>
<div class="actions"><button class="secondary" id="mic">🎙 音声入力</button><button class="primary" id="translate">翻訳する</button></div>
<div class="status" id="status" role="status"></div>
</section>
<section class="panel">
<label>翻訳結果</label><div class="output" id="result">翻訳結果がここに表示されます。</div>
<div class="actions"><button class="secondary" id="speak">🔊 読み上げ</button><button class="secondary" id="copy">コピー</button></div>
</section>
<p class="note">※音声入力は対応ブラウザ・マイク権限が必要です。翻訳にはインターネット接続を使用します。個人情報や機密情報の翻訳には使用しないでください。</p>
</main>
<script>
const langs=[["日本語","ja"],["英語","en"],["中国語（簡体字）","zh"],["韓国語","ko"],["フランス語","fr"],["スペイン語","es"],["ドイツ語","de"],["イタリア語","it"],["ポルトガル語","pt"],["タイ語","th"]];
const from=document.querySelector("#from"),to=document.querySelector("#to"),source=document.querySelector("#source"),result=document.querySelector("#result"),status=document.querySelector("#status");
for(const [name,code] of langs){from.add(new Option(name,code));to.add(new Option(name,code))}
from.value="ja";to.value="en";
document.querySelector("#swap").onclick=()=>{const v=from.value;from.value=to.value;to.value=v};
document.querySelector("#translate").onclick=async()=>{
 const q=source.value.trim();if(!q){status.textContent="文章を入力するか、音声入力してください。";return}
 if(from.value===to.value){result.textContent=q;status.textContent="翻訳元と翻訳先が同じため、そのまま表示しました。";return}
 status.textContent="翻訳しています…";document.querySelector("#translate").disabled=true;
 try{const url="https://api.mymemory.translated.net/get?q="+encodeURIComponent(q)+"&langpair="+encodeURIComponent(from.value+"|"+to.value);
 const res=await fetch(url);if(!res.ok)throw new Error("通信エラー");const data=await res.json();
 if(data.responseStatus!==200)throw new Error(data.responseDetails||"翻訳できませんでした");
 result.textContent=data.responseData.translatedText;status.textContent="翻訳しました。";
 }catch(e){status.textContent="翻訳に失敗しました。通信状態を確認して、短い文章でもう一度試してください。"}
 finally{document.querySelector("#translate").disabled=false}
};
document.querySelector("#mic").onclick=()=>{
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){status.textContent="このブラウザは音声入力に対応していません。文章を入力してください。";return}
 const rec=new SR();rec.lang=from.value==="zh"?"zh-CN":from.value;rec.interimResults=false;rec.onresult=e=>{source.value=e.results[0][0].transcript;status.textContent="音声を文字にしました。"};rec.onerror=()=>status.textContent="音声入力に失敗しました。マイクの許可を確認してください。";rec.start();status.textContent="聞き取り中…";
};
document.querySelector("#speak").onclick=()=>{
 const text=result.textContent;if(!text||text==="翻訳結果がここに表示されます。")return;
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=to.value==="zh"?"zh-CN":to.value;speechSynthesis.speak(u);
};
document.querySelector("#copy").onclick=async()=>{try{await navigator.clipboard.writeText(result.textContent);status.textContent="翻訳結果をコピーしました。"}catch{status.textContent="コピーできませんでした。"}};
</script>
</body></html>
